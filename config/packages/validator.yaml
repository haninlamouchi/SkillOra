# config/packages/vich_uploader.yaml
vich_uploader:
    db_driver: orm
    mappings:
        publication_image:
            uri_prefix: /uploads/publications/images
            upload_destination: '%kernel.project_dir%/public/uploads/publications/images'
            namer: Vich\UploaderBundle\Naming\OrignameNamer

        publication_video:
            uri_prefix: /uploads/publications/videos
            upload_destination: '%kernel.project_dir%/public/uploads/publications/videos'
            namer: Vich\UploaderBundle\Naming\OrignameNamer