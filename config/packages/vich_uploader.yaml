vich_uploader:
    db_driver: orm
    mappings:

        publication_fichier:
            uri_prefix: /uploads/publications
            upload_destination: '%kernel.project_dir%/public/uploads/publications'
            namer: Vich\UploaderBundle\Naming\UniqidNamer
            inject_on_load: false      # ✅ false car File n'est pas sérialisable (session)
            delete_on_update: true     # ✅ supprime l'ancien fichier lors du remplacement
            delete_on_remove: true     # ✅ supprime le fichier si la publication est supprimée

        user_photo:
            uri_prefix: /uploads/photos
            upload_destination: '%kernel.project_dir%/public/uploads/photos'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true

        club_logo:
            uri_prefix: /uploads/clubs
            upload_destination: '%kernel.project_dir%/public/uploads/clubs'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true