security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: plaintext

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: /formations
                always_use_default_target_path: true
                enable_csrf: true
            logout:
                path: app_logout
                target: front_home

    access_control:
        # Responsable area — full scope requires ROLE_RESPONSABLE_CLUB
        - { path: ^/responsable, roles: ROLE_RESPONSABLE_CLUB }

        # Student-only routes (mes formations, en cours, participate, cancel)
        - { path: ^/formations/mes-formations, roles: ROLE_ETUDIANT }
        - { path: ^/formations/en-cours, roles: ROLE_ETUDIANT }

        # Quiz area requires at least ROLE_USER
        - { path: ^/formations/\d+/quiz, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
